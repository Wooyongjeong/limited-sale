spring:
  application:
    name: limited-sale
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Without these Lettuce waits its 60 s default, holding a request thread when Redis stops answering.
      # 1 s over 2 s per the stage 2-5 outage runs: 503 latency p50 about 1 s instead of 2 s, recovery time unchanged.
      timeout: 1s
      connect-timeout: 1s
  session:
    timeout: 30m
    data:
      redis:
        flush-mode: immediate
        namespace: limited-sale:session
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Topics are created by KafkaTopicProvisioner in the background, never while the context starts, so a missing
      # broker cannot fail or delay startup. These stay explicit because Spring Kafka's defaults changed over versions.
      auto-create: false
      fail-fast: false
      modify-topic-configs: false
      operation-timeout: 5s
      close-timeout: 2s
      properties:
        # Without these the admin client waits its 60 s default before giving up on a broker that is not there.
        default.api.timeout.ms: 5000
        request.timeout.ms: 3000
        # Kafka 4 clients rebootstrap on every refused connection; without a longer backoff that is a tight loop
        # (about ten attempts and thirty log lines a second per client) while the broker is down.
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 5000
        retry.backoff.ms: 1000
        retry.backoff.max.ms: 5000
        # The admin client is short-lived (one per provisioning attempt). Rebootstrapping re-reads the bootstrap
        # servers on every failed metadata update, about ten times per refused connection; plain retries are enough.
        metadata.recovery.strategy: none
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Without a short bound a broker outage holds the calling thread for the 60 s default of max.block.ms.
        # delivery.timeout.ms must be at least linger.ms + request.timeout.ms (5 + 3000 here).
        linger.ms: 5
        request.timeout.ms: 3000
        max.block.ms: 5000
        delivery.timeout.ms: 5000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 5000
        retry.backoff.ms: 500
        retry.backoff.max.ms: 2000
    consumer:
      group-id: limited-sale-order-consumer
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # A consumer that dies without leaving the group (SIGKILL, a lost machine) keeps its partitions until the
        # broker gives up on it: 45 s by default stopped a whole sale in 3-8. 10 s, with a heartbeat every 3 s, hands
        # them over sooner; a pause longer than 10 s (a long GC) now costs a rebalance (stage 4-2).
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 5000
        retry.backoff.ms: 1000
        retry.backoff.max.ms: 5000
    listener:
      ack-mode: manual
      # Consumers per application instance; two instances share the six partitions.
      concurrency: 3
  jackson:
    read:
      strict-duplicate-detection: true
  flyway:
    locations: classpath:db/migration,classpath:db/nickmigration
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
limited-sale:
  order:
    async:
      # The v2 asynchronous order API (accept, publish, consume). On since 3-6 finished; v1 is unaffected either way.
      enabled: true
    outbox-publisher:
      # Sends the order outbox rows to Kafka. It runs only together with limited-sale.order.async.enabled=true, and the
      # tests turn it off with a system property so a context that does not test it never opens a Kafka client.
      enabled: true
    consumer:
      # Consumes the accepted requests and creates their orders. Same rule as the publisher: it runs only together with
      # limited-sale.order.async.enabled=true, and the tests turn it off unless they test it.
      enabled: true
management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
