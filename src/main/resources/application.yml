spring:
  application:
    name: limited-sale
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    timeout: 30m
    redis:
      flush-mode: immediate
  flyway:
    locations: classpath:db/migration,classpath:db/nickmigration
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
