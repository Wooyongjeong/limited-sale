spring:
  application:
    name: limited-sale
  profiles:
    default: local
  flyway:
    locations: classpath:db/migration,classpath:db/nickmigration
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health
