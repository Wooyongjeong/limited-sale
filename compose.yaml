services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    # noeviction keeps sessions from being evicted under memory pressure; writes fail instead. Persistence stays at the image default.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    # Apache KRaft, one node that is both broker and controller. Local runs and tests only: replication is 1,
    # so stopping this container stops messaging. It is not a high-availability setup.
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST is what the application on the host dials and must advertise the published port; INTERNAL is for other
      # containers (kafka-exporter). The host port is the same inside and outside so the advertised address is valid.
      KAFKA_LISTENERS: HOST://:${KAFKA_PORT:-9092},INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # The application creates its topic (NewTopic); a mistyped topic name must fail instead of appearing.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
  load-balancer:
    profiles: ["multi-instance"]
    image: caddy:2.11.2-alpine
    ports:
      - "127.0.0.1:${LB_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    # Reaches the sales app's management port on the host; host-gateway makes the name resolve on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.98.0
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
  kafka-exporter:
    profiles: ["monitoring"]
    image: danielqsj/kafka-exporter:v1.11.0
    depends_on:
      kafka:
        condition: service_healthy
    # Reads topic offsets and consumer-group offsets from the broker, so lag stays visible when the consumer is down.
    command: ["--kafka.server=kafka:19092"]
    ports:
      - "127.0.0.1:${KAFKA_EXPORTER_PORT:-9308}:9308"
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
    environment:
      # Local-only: anonymous visitors are read-only Viewers. No password is committed.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
volumes:
  mysql_data:
  kafka_data:
  prometheus_data:
  grafana_data:
