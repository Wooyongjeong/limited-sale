plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.wooyongjeong'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    integrationTestImplementation 'org.testcontainers:mysql'
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation project(':mock-pg')
}
tasks.register('integrationTest', Test) {
    description = 'Runs MySQL integration tests (Docker required).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}
tasks.named('check') { dependsOn tasks.named('integrationTest') }

tasks.register('initAdmin', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wooyongjeong.limitedsale.member.infrastructure.AdminInitializer'
}
