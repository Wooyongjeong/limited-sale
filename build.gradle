plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'com.wooyongjeong'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    integrationTestImplementation 'org.testcontainers:testcontainers-mysql'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    integrationTestImplementation project(':mock-pg')
}
tasks.register('integrationTest', Test) {
    description = 'Runs MySQL integration tests (Docker required).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
    inputs.file('tools/reconciliation/reconcile.sql')
}
tasks.named('check') { dependsOn tasks.named('integrationTest') }

tasks.register('initAdmin', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wooyongjeong.limitedsale.member.infrastructure.AdminInitializer'
}

// The snapshot verifier is deliberately independent of application and PG database access.
tasks.register('orderRegressionVerifierTest', Exec) {
    group = 'verification'
    description = 'Checks the order regression snapshot verifier with corrupted fixtures.'
    commandLine 'python3', '-B', '-m', 'unittest', 'discover', '-s', 'tools/order-regression', '-v'
}
tasks.named('check') { dependsOn tasks.named('orderRegressionVerifierTest') }
